<!DOCTYPE html>
<html lang="en">

<!-- Texto original de mis compañeros -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Alex Dev - portfolio</title>
</head>

<body>
    <header>
        <h1>Alex Dev</h1>
        <nav>
            <a href="#sobre-mi">Sobre mi</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>
    <main>
        <section id="sobre-mi">
            <h2>Sobre mi</h2>
            <p class="description">Descripcion</p>

            <h3>Proyectos</h3>
            <table>
                <thead>
                    <tr>
                        <th>Proyecto</th>
                        <th>Tecnologia</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Portafolio</td>
                        <td>HTML + CSS</td>
                        <td>Finalizado</td>
                    </tr>
                    <tr>
                        <td>Landing Page</td>
                        <td>HTML + css</td>
                        <td>En proceso</td>
                    </tr>
                </tbody>
            </table>

        </section>
        <section id="contacto">
            <h2>Contacto</h2>
            <p>Descripcion</p>

            <form>
                <label for="">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre">
                <label for="">Mail</label>
                <input type="email" id="email" name="email" placeholder="ingresesumail@gmail.com">
                <label for="">Mensaje</label>
                <textarea name="mensaje" id="mensaje" rows="5" placeholder="Ingrese su mensaje"></textarea>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        © 2026 Alex Dev | Pagina Personal
    </footer>
</body>

</html>
